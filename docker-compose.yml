services:
  app:
    build:
      context: .
      # The build downloads npm and Go packages via the host network.
      # On Windows/WSL (especially with a VPN) the Docker bridge network
      # otherwise often hangs for minutes at "npm ci" and "go mod download".
      network: host
    image: was-koch-ich-heute:latest
    ports:
      - "8080:8080"
    # API keys and settings from .env (see .env.example).
    # Without a key the app starts in demo mode.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
