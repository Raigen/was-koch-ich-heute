services:
  app:
    build:
      context: .
      # Der Build lädt npm- und Go-Pakete über das Netzwerk des Hosts.
      # Unter Windows/WSL (v. a. mit VPN) hängt das Docker-Bridge-Netz
      # sonst oft minutenlang bei "npm ci" und "go mod download".
      network: host
    image: was-koch-ich-heute:latest
    ports:
      - "8080:8080"
    # API-Keys und Einstellungen aus .env (siehe .env.example).
    # Ohne Key startet die App im Demo-Modus.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
